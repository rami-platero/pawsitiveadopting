name: Migrate Production Database

on:
  workflow_dispatch:
    inputs:
      migration_direction:
        description: 'Migration direction'
        required: true
        default: 'push'
        type: choice
        options:
          - push
          - drop
  workflow_run:
    workflows: ["Build"]
    branches:
      - main
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  migrate-production:
    runs-on: ubuntu-22.04
    environment: Production
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: ./.github/actions/pnpm-install
      
      - name: Run Drizzle Migrations
        run: pnpm --filter pawsitive-adopting exec drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_SENDER_NAME: ${{ secrets.EMAIL_SENDER_NAME }}
          EMAIL_SENDER_ADDRESS: ${{ secrets.EMAIL_SENDER_ADDRESS }}
          BASE_URL: ${{ secrets.BASE_URL }}

      - name: Verify Migration Status
        run: pnpm --filter pawsitive-adopting exec drizzle-kit check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_SENDER_NAME: ${{ secrets.EMAIL_SENDER_NAME }}
          EMAIL_SENDER_ADDRESS: ${{ secrets.EMAIL_SENDER_ADDRESS }}
          BASE_URL: ${{ secrets.BASE_URL }}
      
      - name: Notify on Success
        if: success()
        run: |
          echo "✅ Production database migration completed successfully"
      
      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Production database migration failed"
          exit 1
